<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미쿠의 대파탑</title>
<style>
:root{--bg1:#fff6d6;--bg2:#d9f0c0;--ink:#234a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1c2a22;--bg2:#12201a;--ink:#e6f5df;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1c2a22;--bg2:#12201a;--ink:#e6f5df;color-scheme:dark}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:grid;place-items:center;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;width:min(100%,1000px);padding:10px;box-sizing:border-box}
.slot{justify-self:center;width:100%;max-width:240px;border:3px dashed rgba(63,157,59,.5);border-radius:18px;background:rgba(63,157,59,.1);display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;box-sizing:border-box;font-size:13px;opacity:.85;overflow:hidden}
@media(max-width:560px){.slot span{display:none}}
.stage{position:relative;height:min(calc(100dvh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),640px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:rgba(10,30,15,.62);color:#fff}
#ov.hide{display:none}
#ov p{font-size:22px;line-height:1.5;margin:0;font-weight:700;word-break:keep-all}
#ov p.big{font-size:96px;animation:pop .9s ease-out}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
button{font:inherit;font-weight:700;font-size:18px;padding:10px 26px;border:0;border-radius:999px;background:#7ddc5f;color:#143a14;cursor:pointer;box-shadow:0 4px 0 #3f9d3b}
button.sub{background:#fff;color:#234;box-shadow:0 4px 0 #bbb}
button:active{transform:translateY(2px)}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:42px;font-weight:900;color:#fff;text-shadow:0 3px 0 #2e8b3d,0 0 14px rgba(0,0,0,.4);pointer-events:none;opacity:0}
#ht.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#msg.go{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
</style></head><body>
<div id="wrap">
  <div class="slot"><span>캐릭터 자리</span></div>
  <div class="stage">
    <canvas id="cv" width="720" height="1280"></canvas>
    <div class="hud"><span id="fl">0층</span><span id="sp"></span><span id="bs"></span></div>
    <div id="msg"></div><div id="ht" class="hint"></div><div id="ov"></div>
  </div>
  <div class="slot"><span>캐릭터 자리</span></div>
</div>
<script>
const $=id=>document.getElementById(id),ov=$('ov'),cv=$('cv'),ctx=cv.getContext('2d');
ctx.setTransform(2,0,0,2,0,0);
const W=360,H=640,HW=36,BH=50,GR=H-60,PED=104,TOPY=62,TGT=330;
// ── 대파 조각 모양: 바닥이 평평한 세로 줄기(|) + 옆으로 튀어나온 가지(/) ──
const hh=BH/2,SW=8,BT=4.5,P0=[0,hh-BH*.45],P1=[30,-hh+5]; // 줄기 폭 2*SW, 가지는 줄기 아래 45% 지점에서 시작해 줄기 끝 높이까지
function seg(a,b,t){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l*t,ny=dx/l*t;return[[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]]}
function polyC(p){let a=0,cx=0,cy=0;for(let i=0;i<p.length;i++){const[x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length],c=x0*y1-x1*y0;a+=c;cx+=(x0+x1)*c;cy+=(y0+y1)*c}a/=2;return{a:Math.abs(a),cx:cx/(6*a),cy:cy/(6*a)}}
const RAW=[[[-SW,-hh],[SW,-hh],[SW,hh],[-SW,hh]],seg(P0,P1,BT)],AR=RAW.map(polyC),TA=AR.reduce((s,q)=>s+q.a,0);
const CX=AR.reduce((s,q)=>s+q.a*q.cx,0)/TA,CY=AR.reduce((s,q)=>s+q.a*q.cy,0)/TA; // 무게중심 (x는 기준점으로 삼음)
const PP=RAW.map(P=>P.map(([x,y])=>[x-CX,y]));
// 외곽선을 촘촘히 샘플링한 점들
const PTS=[];for(const P of PP)for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];for(let t=0;t<1;t+=.1)PTS.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
// 좌우반전(fl)·회전(a) 적용 후:
//  lo~hi  = 맨 윗부분(깊이 DB 이내)의 x범위 → 위에 올라오는 조각의 지지 범위
//  blo~bhi = 맨 아랫부분의 x범위 → 이 조각이 아래에 닿는 범위, cm = 무게중심 x 오프셋
function info(fl,a){const c=Math.cos(a),s=Math.sin(a),DB=8,Q=PTS.map(([x,y])=>[fl*x*c-y*s,fl*x*s+y*c]);
  const y0=Math.min(...Q.map(q=>q[1])),y1=Math.max(...Q.map(q=>q[1])),T=Q.filter(q=>q[1]<=y0+DB).map(q=>q[0]),B=Q.filter(q=>q[1]>=y1-DB).map(q=>q[0]);
  let lo=Math.min(...T),hi=Math.max(...T);if(hi-lo<10){const m=(lo+hi)/2;lo=m-5;hi=m+5}
  return{lo,hi,blo:Math.min(...B),bhi:Math.max(...B),cm:-CY*s}}
const STORY=["미쿠는 파가 좋다","미쿠는 전설의 대대대파를 가지고 싶다","어느 날 길을 가다가","한 노인이 대대대파는 하늘대파궁에 있다고 말해준다","미쿠는 하늘대파궁에 들어가기 위해 대파로 탑을 쌓아 올라가기로 결심한다"];
let state='story',stack=[],debris=[],f=null,camY=0,mx=HW,dir=1,score=0,ct=0,shake=0,best=0,tl=[],col=null,tm=0,ang=0,rph=0;
const nfl=()=>stack.length%2?-1:1;
try{best=+localStorage.getItem('daepaBest')||0}catch(e){}
const clouds=Array.from({length:14},()=>({x:Math.random()*W,y:Math.random()*760,s:.6+Math.random()*.8}));
const speed=()=>Math.min(1000,200+50*Math.floor(stack.length/10));
function show(h){ov.className='';ov.innerHTML=h}
function hud(){$('fl').textContent=stack.length+'층';$('bs').textContent='최고 '+best+'층';$('sp').textContent='속도 Lv.'+(Math.floor(stack.length/10)+1)}
function reset(){stack=[];debris=[];f=null;camY=0;mx=HW;dir=1;score=0;shake=0;tl=[];col=null;ang=0;hud()}
function story(i){state='story';show(`<p>${STORY[i]}</p><button id="b">다음</button>`);$('b').onclick=()=>i+1<STORY.length?story(i+1):ready()}
function ready(){state='ready';show('<p>미쿠의 대파탑</p><button id="b">스타트</button>');$('b').onclick=begin}
function begin(){reset();state='count';let n=3;const tick=()=>{if(n==0){ov.className='hide';state='play';return}show(`<p class="big">${n}</p>`);n--;setTimeout(tick,900)};tick()}
// 1번째 탭: 좌우 위치 고정 → 2번째 탭: 회전 각도 고정 후 낙하
function tap(){
  if(state=='play'){state='rot';ang=Math.random()*6.28}
  else if(state=='rot'){f={x:mx,y:TOPY-camY,vy:0,a:ang,fl:nfl()};state='drop'}
}
addEventListener('pointerdown',e=>{if(!e.target.closest('button'))tap()});
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();tap()}});
function finish(win){state='over';const nw=score>best;if(nw){best=score;try{localStorage.setItem('daepaBest',best)}catch(e){}}hud();
 show(`<p>${win?'하늘대파궁에 도착했다!<br>':''}당신은 ${score}층의 대파를 쌓았습니다</p><p style="font-size:15px;opacity:.9">최고 기록 ${best}층${nw&&score>0?' · 신기록!':''}</p><button id="b1">다시 하기</button><button id="b2" class="sub">스토리 다시 보기</button>`);
 $('b1').onclick=begin;$('b2').onclick=()=>{reset();story(0)}}
function land(x,a,fl){
  const n=stack.length,p={x,a,fl,...info(fl,a)};stack.push(p);let sum=0,bad=0,bd=0,nt=[];
  // 각 층: 그 위 대파들의 무게중심이 아래 조각의 지지 범위(회전·반전 반영) 안에 있어야 함
  for(let k=n+1;k>=1;k--){const q=stack[k-1];sum+=q.x+q.cm;const com=sum/(n+2-k);let L,R;
    if(k==1){L=W/2-PED/2;R=W/2+PED/2}else{const b=stack[k-2];L=b.x+b.lo;R=b.x+b.hi}
    const mid=(L+R)/2,hf=(R-L)/2,d=com-mid,s=Math.sign(d);
    nt[k-1]={s,u:Math.max(0,(Math.abs(d)/hf-.45)/.55),px:mid+(s||1)*hf,L,R};if(Math.abs(d)>hf){bad=k;bd=s||1}}
  f=null;
  if(bad){score=n;const t=nt[bad-1];col={ph:0,ang:0,w:.15,bd,k:bad,px:t.px,py:GR-(bad-1)*BH,bl:stack.splice(bad-1)};tl=nt;state='collapse';ct=0;if(bad==n+1&&Math.min(x+p.bhi,t.R)-Math.max(x+p.blo,t.L)<6){col.w=0;release()}}
  else if(stack.length>=500){score=500;hud();finish(true)}
  else{tl=nt;state='play';hud();if(stack.length%10==0)toast(stack.length+'층 돌파!')}
}
function toast(t){const m=$('msg');m.textContent=t;m.classList.remove('go');void m.offsetWidth;m.classList.add('go')}
function release(){const c=col,a=c.bd*c.ang,w=c.bd*c.w,co=Math.cos(a),si=Math.sin(a);
  c.bl.forEach((p,i)=>{const k=c.k+i,rx=p.x-c.px,ry=GR-(k-.5)*BH-c.py;
    debris.push({x:c.px+rx*co-ry*si,y:c.py+rx*si+ry*co,vx:-w*ry*1.3+(Math.random()-.5)*50,vy:w*rx*1.3-30,r:a+p.a,vr:w+(Math.random()-.5)*1.5,fl:p.fl})});
  c.ph=1;ct=0;shake=.45}
function update(dt){
  camY+=(Math.max(0,TGT-(GR-stack.length*BH))-camY)*Math.min(1,dt*6);
  if(state=='play'){mx+=dir*speed()*dt;if(mx>W-HW){mx=W-HW;dir=-1}if(mx<HW){mx=HW;dir=1}}
  else if(state=='rot'){ang+=Math.min(3,1.2+.05*Math.floor(stack.length/10))*dt} // 시계방향으로 계속 회전
  else if(state=='drop'){f.vy+=2400*dt;f.y+=f.vy*dt;if(f.y>=GR-(stack.length+.5)*BH)land(f.x,f.a,f.fl)}
  tm+=dt;for(const d of debris){d.vy+=1800*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.r+=d.vr*dt}
  if(state=='collapse'){if(col.ph==0){col.w+=(.9+7*col.ang)*dt;col.ang+=col.w*dt;if(col.ang>.6)release()}else{ct+=dt;if(ct>1.7)finish(false)}}
}
const lerp=(a,b,t)=>a+(b-a)*t,mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join()+')';
function cloud(x,y,s){ctx.beginPath();ctx.arc(x,y,16*s,0,7);ctx.arc(x+18*s,y-8*s,20*s,0,7);ctx.arc(x+40*s,y,16*s,0,7);ctx.fill()}
function onion(x,y,fl,r=0,pv,pa=0){
  ctx.save();if(pv){ctx.translate(pv[0],pv[1]);ctx.rotate(r);ctx.translate(-pv[0],-pv[1]);ctx.translate(x,y)}else{ctx.translate(x,y);ctx.rotate(r)}
  ctx.rotate(pa);ctx.scale(fl,1);ctx.translate(-CX,0);ctx.lineCap='round';ctx.lineJoin='round';
  // 가지(/): 줄기 옆으로 비스듬히 뻗은 초록 가지 (살짝 S자)
  const dx=P1[0]-P0[0],dy=P1[1]-P0[1],l=Math.hypot(dx,dy),ox=-dy/l*2.5,oy=dx/l*2.5;
  const curve=()=>{ctx.beginPath();ctx.moveTo(P0[0],P0[1]);ctx.bezierCurveTo(P0[0]+dx*.33+ox,P0[1]+dy*.33+oy,P0[0]+dx*.66-ox,P0[1]+dy*.66-oy,P1[0],P1[1])};
  const bg=ctx.createLinearGradient(P0[0],P0[1],P1[0],P1[1]);bg.addColorStop(0,'#b5e07a');bg.addColorStop(1,'#2e8b3d');
  curve();ctx.strokeStyle='#1f5f2c';ctx.lineWidth=BT*2+3;ctx.stroke();curve();ctx.strokeStyle=bg;ctx.lineWidth=BT*2;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P0[0]+dx*.2-2,P0[1]+dy*.2-3);ctx.lineTo(P0[0]+dx*.85-2,P0[1]+dy*.85-3);ctx.stroke();
  // 줄기(|): 바닥이 평평한 길쭉한 흰 줄기
  const gs=ctx.createLinearGradient(0,hh,0,-hh);gs.addColorStop(0,'#fffef5');gs.addColorStop(.55,'#e8f3d2');gs.addColorStop(1,'#a9d878');
  ctx.fillStyle=gs;ctx.beginPath();ctx.roundRect(-SW,-hh,SW*2,BH,[6,6,0,0]);ctx.fill();ctx.strokeStyle='#1f5f2c';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(-SW+3,-hh+7,3,BH-16);
  ctx.restore();
}
function draw(){
  const p=Math.min(1,Math.max(0,(stack.length-150)/50)); // 150~200층: 하늘로 전환
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mix([150,215,255],[40,120,235],p));g.addColorStop(1,mix([236,250,214],[170,215,255],p));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake*20,(Math.random()-.5)*shake*20);shake-=.016}
  ctx.fillStyle='rgba(255,255,255,'+(.45+.4*p)+')';
  for(const c of clouds)cloud(c.x,((c.y+camY*.5)%760+760)%760-60,c.s);
  if(p<1){ctx.globalAlpha=1-p;ctx.fillStyle='#a8d98a';const b=GR-30+camY*.4;ctx.beginPath();ctx.moveTo(0,H+400);
    for(let x=0;x<=W;x+=10)ctx.lineTo(x,b-30*Math.sin(x/55)-20*Math.sin(x/23+1));ctx.lineTo(W,H+400);ctx.fill();ctx.globalAlpha=1}
  const gy=GR+camY;
  if(gy<H){ctx.fillStyle='#6dbb4a';ctx.fillRect(0,gy,W,H);ctx.fillStyle='#8a6a4a';ctx.beginPath();ctx.roundRect(W/2-PED/2,gy,PED,16,4);ctx.fill()}
  stack.forEach((p,i)=>{const y=GR-(i+.5)*BH+camY;if(y>-40&&y<H+40){const t=tl[i];let r=0,pv;if(t&&t.u>0){r=t.s*t.u*t.u*.15+Math.sin(tm*6+i)*t.u*t.u*.025;pv=[t.px,y+BH/2]}onion(p.x,y,p.fl,r,pv,p.a)}});
  if(col&&state=='collapse'&&col.ph==0){ctx.save();ctx.translate(col.px,col.py+camY);ctx.rotate(col.bd*col.ang);ctx.translate(-col.px,-col.py-camY);col.bl.forEach((p,j)=>{const k=col.k+j;onion(p.x,GR-(k-.5)*BH+camY,p.fl,0,undefined,p.a)});ctx.restore()}
  if(state=='play'||state=='rot'||state=='count'){
    if(state=='play'||state=='rot'){ctx.strokeStyle='rgba(255,255,255,.45)';ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(mx,TOPY+BH);ctx.lineTo(mx,GR-stack.length*BH+camY);ctx.stroke();ctx.setLineDash([])}
    onion(mx,TOPY,nfl(),0,undefined,state=='rot'?ang:0)}
  if(f)onion(f.x,f.y+camY,f.fl,0,undefined,f.a);
  for(const d of debris)onion(d.x,d.y+camY,d.fl,d.r);
  ctx.restore();
}
let last=performance.now();
const HS={play:'① 탭: 좌우 고정',rot:'② 탭: 회전 멈추고 낙하!'};
function loop(t){const h=HS[state]||'';if($('ht').textContent!=h)$('ht').textContent=h;const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
reset();story(0);requestAnimationFrame(loop);
</script></body></html>
